[env:esp32s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
; ESP32-S3-N16R8: quad SPI flash
board_build.flash_mode = qio
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; generates src/local_config.h from .env.example + .env
extra_scripts = pre:tools/gen_local_config.py, post:tools/ota_target.py

; Same firmware with a self-test app_main for Espressif QEMU (see tools/qemu_selftest.sh)
[env:qemu]
extends = env:esp32s3
build_flags = -DPRINTSERVER_QEMU_SELFTEST
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.qemu
